<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatroom | محمد آبزن</title><meta name="theme-color" content="#1A1230">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Chatroom"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="{{ url_for('static', filename='theme.js') }}?v={{ ASSET_V }}"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;700&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ ASSET_V }}">
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script></head>
<body class="chat-body">
<svg width="0" height="0" style="position:absolute"><symbol id="star" viewBox="0 0 48 48"><polygon fill="currentColor" points="24,2 28.97,11.99 39.56,8.44 36.01,19.03 46,24 36.01,28.97 39.56,39.56 28.97,36.01 24,46 19.03,36.01 8.44,39.56 11.99,28.97 2,24 11.99,19.03 8.44,8.44 19.03,11.99"/><circle cx="24" cy="24" r="5" fill="var(--night)"/></symbol></svg>
<div class="app">
  <aside class="side" id="sidebar">
    <div class="side-head"><div class="brand"><svg class="mark"><use href="#star"/></svg><span>Chatroom</span></div><div class="side-tools"><button class="key round small" data-theme-btn title="تغییر تم" aria-label="تغییر تم">◐</button><button class="key round small mobile-only" id="close-sidebar" aria-label="بستن">✕</button></div></div>
    <div class="me"><div class="avatar" id="my-avatar">{% if current_user.avatar_url %}<img src="{{ current_user.avatar_url }}" alt="">{% else %}{{ current_user.avatar }}{% endif %}</div><div class="me-info"><strong id="my-display">{{ current_user.display_name }}</strong><span>@{{ current_user.username }}</span></div><button class="key round small" id="open-profile" title="ویرایش پروفایل" aria-label="ویرایش پروفایل">⚙</button></div>
    <div class="side-title"><span>گروه‌ها</span><button class="key round small hot" id="open-create-group" title="گروه جدید" aria-label="گروه جدید">+</button></div>
    <nav id="group-list" class="group-list"></nav>
    <div class="side-foot"><button class="key small" data-install-btn hidden>نصب برنامه</button><span class="live"><i></i><b id="online-count">0</b> نفر آنلاین</span><a href="{{ url_for('logout') }}" class="logout">خروج</a></div>
  </aside>
  <main class="room">
    <header class="room-head">
      <button class="key round small mobile-only" id="open-sidebar" aria-label="منو">☰</button>
      <div class="room-title"><h2 id="group-name-head">&nbsp;</h2><p id="group-description"></p></div>
      <button class="key small" id="share-group">لینک دعوت</button><button class="key small" id="open-group">تنظیمات</button><button class="key small members-toggle" id="open-members">اعضا</button>
    </header>
    <div class="conn" id="conn" data-state="connecting" role="status">در حال اتصال…</div>
    <div class="feed" id="messages" aria-live="polite"></div>
    <button class="key round jump" id="jump" hidden aria-label="رفتن به آخرین پیام">↓<b id="jump-n" hidden></b></button>
    <div class="typing" id="typing" aria-live="polite"></div>
    <div class="ctx" id="ctx-bar" hidden><div><b id="ctx-kind"></b><span id="ctx-text"></span></div><button type="button" class="key round small" id="cancel-ctx" aria-label="لغو">✕</button></div>
    <form class="composer" id="message-form">
      <textarea id="message-input" rows="1" maxlength="1000" placeholder="پیامت را بنویس…" aria-label="متن پیام"></textarea>
      <button class="key hot round send" type="submit" id="send-button" aria-label="ارسال">➤</button>
    </form>
  </main>
  <aside class="people" id="people">
    <div class="people-head"><h3>اعضا</h3><span class="count" id="member-count">0</span><button class="key round small mobile-only" id="close-members" aria-label="بستن">✕</button></div>
    <div id="members-list" class="members"></div>
  </aside>
</div>

<div class="menu" id="msg-menu" role="menu"></div>
<div class="toast" id="toast" role="status"></div>

<div class="modal" id="profile-modal"><section class="card"><h2>پروفایل من</h2>
  <label>عکس پروفایل</label><input id="profile-photo" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><small>PNG، JPG، WEBP یا GIF تا ۴ مگابایت</small>
  <label>ایموجی (وقتی عکس نداری)</label><input id="profile-avatar" maxlength="12" value="{{ current_user.avatar }}">
  <label>نام نمایشی</label><input id="profile-name" maxlength="32" value="{{ current_user.display_name }}">
  <label>درباره من</label><textarea id="profile-bio" maxlength="160" rows="3" placeholder="چند کلمه درباره خودت">{{ current_user.bio }}</textarea>
  <div class="actions"><button class="key" data-close="profile-modal">بستن</button><button class="key hot" id="save-profile">ذخیره</button></div><p class="status" id="profile-status"></p></section></div>
<div class="modal" id="user-view-modal"><section class="card center"><div class="avatar xl" id="view-user-avatar">🙂</div><h2 id="view-user-name"></h2><p class="handle" id="view-user-id"></p><p class="bio" id="view-user-bio"></p><div class="actions"><button class="key" data-close="user-view-modal">بستن</button></div></section></div>
<div class="modal" id="create-group-modal"><section class="card"><h2>گروه جدید</h2><label>نام گروه</label><input id="new-group-name" maxlength="40" placeholder="مثلاً گپ برنامه‌نویسی"><label>توضیحات</label><textarea id="new-group-description" maxlength="180" rows="3"></textarea><div class="actions"><button class="key" data-close="create-group-modal">بستن</button><button class="key hot" id="create-group-submit">ساخت گروه</button></div><p class="status" id="create-group-status"></p></section></div>
<div class="modal" id="group-modal"><section class="card"><h2>تنظیمات گروه</h2><label>نام گروه</label><input id="edit-group-name" maxlength="40"><label>توضیحات</label><textarea id="edit-group-description" maxlength="180" rows="3"></textarea><label>لینک دعوت</label><div class="row"><input id="group-invite-url" readonly placeholder="روی «لینک دعوت» بزن"><button type="button" class="key" id="copy-invite">کپی</button></div><div class="actions"><button class="key" data-close="group-modal">بستن</button><button class="key hot" id="save-group">ذخیره</button></div><p class="status" id="group-status"></p></section></div>
<div class="modal" id="sheet"><section class="card"><h2 id="sheet-title"></h2><div id="sheet-body"></div><div class="actions" id="sheet-actions"></div></section></div>

<script>
window.CHATROOM = {
  username: {{ current_user.username|tojson }}, me: {{ current_user|tojson }},
  initialUsers: {{ users|tojson }}, initialGroups: {{ groups|tojson }},
  initialGroup: {{ request.args.get("group", "")|tojson }}
};
</script>
<script src="{{ url_for('static', filename='chat.js') }}?v={{ ASSET_V }}"></script>
<script src="{{ url_for('static', filename='pwa.js') }}?v={{ ASSET_V }}"></script>
</body></html>
